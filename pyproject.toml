[project]
name = "shinafure"
version = "0.4.0"
description = "Canary-person registry checked by AI providers on inference inputs, with an OPRF ledger that never holds plaintext."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
proxy = ["fastapi>=0.110"]
demo = ["faker>=20", "fastapi>=0.110", "httpx>=0.27"]
test = ["pytest>=8", "faker>=20", "fastapi>=0.110", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shinafure"]
